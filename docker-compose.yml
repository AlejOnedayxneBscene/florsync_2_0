version: "3.9"

services:

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: FlorsyncBD
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: florsync123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./wal-archive:/var/lib/postgresql/wal_archive
      - ./docker/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: >
      postgres
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c listen_addresses='*'
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='cp %p /var/lib/postgresql/wal_archive/%f'
      -c archive_timeout=3600
      -c max_wal_senders=10
      -c max_replication_slots=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  
  restore:
    build: ./florsync_backend
    restart: "no"                        # nunca reiniciar automáticamente
    profiles:
      - restore                          # no arranca con `docker compose up`
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./florsync_backend:/app          # restore.py vive aquí
      - postgres_data:/var/lib/postgresql/data   # acceso directo al volumen de pg
      - ./wal-archive:/wal-archive       # WALs compartidos con db
    # No hay command: se invoca manualmente con `docker compose run`

  backend:
    build: ./florsync_backend
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:florsync123@db:5432/FlorsyncBD
    ports:
      - "8000:8000"
    volumes:
      - ./florsync_backend:/app
      - ./wal-archive:/wal-archive
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

  wal:
    build: ./florsync_backend
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:florsync123@db:5432/FlorsyncBD
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./florsync_backend:/app
      - ./wal-archive:/wal-archive
    command: ["python", "manage.py", "upload_wal"]
    stop_grace_period: 90s

  backup:
    build: ./florsync_backend
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./base-backup:/basebackup
      - ./wal-archive:/wal-archive
    command: >
      sh -c "
      if [ ! -f /basebackup/.backup_done ]; then
        echo '[BACKUP] Ejecutando backup inicial...' &&
        python manage.py basebackup &&
        touch /basebackup/.backup_done
      else
        echo '[BACKUP] Backup inicial ya existe, omitiendo.'
      fi &&
      sh /app/scripts/backup_scheduler.sh
      "

  frontend:
    build: ./florsync_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./florsync_frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: ["npm", "run", "dev", "--", "--host"]

volumes:
  postgres_data: